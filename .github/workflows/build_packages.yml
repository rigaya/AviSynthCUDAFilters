name: Build Linux Packages

on:
  push:
    branches:
      - master
      - linux
    tags:
      - '*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu20.04を基盤とする単一ビルド。
          # ABIフロアがglibc 2.31 / GLIBCXX 3.4.28 / CXXABI 1.3.12まで下がるため、
          # RHEL/Rocky/AlmaLinux 9 (GLIBCXX 3.4.29) やDebian 12を含む
          # 現行ディストリを1つの成果物でカバーできる。
          # CUDAは11.8を使う。CUDA 12ではcompute_35 (Kepler) がビルドできない。
          - dockerimg: ubuntu2004_cuda11
            osver: linux
            arch: x86_64
          #- dockerimg: ubuntu2204_cuda11_aarch64
          #  osver: linux_aarch64
          #  arch: arm64

    env:
      DOCKER_FILE:  docker/docker_${{ matrix.dockerimg }}
      DOCKER_IMAGE: ${{ matrix.dockerimg }}

    name: Upload Release Asset
    runs-on: ubuntu-latest
    steps:
      - name: Prepare
        id: prep
        run: |
          REPOSITORY=$(echo ${{ github.repository }} | sed -e "s#.*/##")
          VERSION=$(echo ${{ github.ref }} | sed -e "s#refs/tags/##g")
          IMAGE="build_avisynthcudafilters_"${{ env.DOCKER_IMAGE }}
          TAG=$(echo $GITHUB_SHA | head -c7)
          NPROC=$(grep 'processor' /proc/cpuinfo | wc -l)
          OUTPUT_DIR=`pwd`/output
          LOCAL_USER_ID=$(id -u)
          LOCAL_GROUP_ID=$(id -g)
          echo "tagged_image=${IMAGE}:${TAG}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "nproc=${NPROC}" >> $GITHUB_OUTPUT
          echo "output_dir=${OUTPUT_DIR}" >> $GITHUB_OUTPUT
          echo "local_user_id=${LOCAL_USER_ID}" >> $GITHUB_OUTPUT
          echo "local_group_id=${LOCAL_GROUP_ID}" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Create Output Dir
        run: |
          mkdir -p ${{ steps.prep.outputs.output_dir }}

      - name: Set up QEMU
        if: matrix.arch != 'x86_64'
        uses: docker/setup-qemu-action@v3

      - name: Build Exec
        id: build_exec
        run: |
          docker build --build-arg LOCAL_USER_ID=${{ steps.prep.outputs.local_user_id }} --build-arg LOCAL_GROUP_ID=${{ steps.prep.outputs.local_group_id }} --tag ${{ steps.prep.outputs.tagged_image }} --platform linux/${{ matrix.arch }} --file ${{ env.DOCKER_FILE }} ./
          docker run -dit --rm -v ${{ steps.prep.outputs.output_dir }}:/output --name build_pkg ${{ steps.prep.outputs.tagged_image }}
          docker exec build_pkg ./scripts/buildAviSynthPlusCUDA.sh
          docker exec build_pkg ./scripts/buildAviSynthCUDAFilters.sh
          # debとtar.xzの両方を回収する。tar.xzはdebのペイロードから生成しており内容は同一で、
          # debを扱えないディストリ (Fedora / RHEL系 / Arch / openSUSE) 向け。
          docker exec build_pkg sh -c "cp -v ./AviSynthPlus/avisynth-build/avisynth_*.deb ./AviSynthPlus/avisynth-build/avisynth_*.tar.xz /output/"
          docker exec build_pkg sh -c "cp -v ./build/avisynthcudafilters_*.deb ./build/avisynthcudafilters_*.tar.xz /output/"
          # コンテナ内はrootでビルドするため、/output配下の所有者をホスト実行ユーザに合わせる。
          # id解決はコンテナ内で行う必要があるのでシングルクォートにする。
          docker exec build_pkg sh -c 'find /output/ -type f | xargs chown $(id rigaya -u):$(id rigaya -g)'
          # 単一ビルドなのでOSバージョンではなく linux をサフィックスとする
          for ext in deb tar.xz; do
            for name in avisynth avisynthcudafilters; do
              PKG_ORG=`ls ${{ steps.prep.outputs.output_dir }}/${name}_*.${ext}`
              PKG=`echo ${PKG_ORG} | sed -e "s/\.${ext}$/_${{ matrix.osver }}.${ext}/"`
              mv ${PKG_ORG} ${PKG}
              echo ${PKG}
              echo "pkg_${name}_`echo ${ext} | tr . _`=${PKG}" >> $GITHUB_OUTPUT
            done
          done

      - name: Calc hash
        id: calc_hash
        run: |
          7z h -scrc* ${{ steps.build_exec.outputs.pkg_avisynth_deb }}
          7z h -scrc* ${{ steps.build_exec.outputs.pkg_avisynth_tar_xz }}
          7z h -scrc* ${{ steps.build_exec.outputs.pkg_avisynthcudafilters_deb }}
          7z h -scrc* ${{ steps.build_exec.outputs.pkg_avisynthcudafilters_tar_xz }}

      - name: Verify Kepler (compute_35) support
        run: |
          # CUDA 12はcompute_35を切ったため、うっかりCUDA 12でビルドすると
          # Kepler世代のGPUが動かなくなる。PTXが埋まっていることを確認する。
          for so in AvsCUDA/AvsCUDA KFM/KFM KTGMC/KTGMC; do
            if ! docker exec build_pkg /usr/local/cuda/bin/cuobjdump -lptx ./build/${so}.so | grep -q 'sm_35'; then
              echo "compute_35のPTXが埋め込まれていません: ${so}.so"
              exit 1
            fi
          done
          echo "compute_35 (Kepler) のPTXは埋め込まれています"

      - name: Verify no CUDA runtime dependency
        run: |
          # meson 1.2以降のcudart_staticリンクが効いていることの確認。
          # libcudart.so.* を要求していると、CUDA Toolkit未導入の環境で読み込めない。
          mkdir -p check && tar -C check -xf ${{ steps.build_exec.outputs.pkg_avisynthcudafilters_tar_xz }}
          FOUND=0
          for so in `find check -name '*.so'`; do
            if objdump -p ${so} | grep -q 'NEEDED.*libcudart'; then
              echo "libcudartへの動的依存が残っています: ${so}"
              FOUND=1
            fi
          done
          [ ${FOUND} -eq 0 ] || exit 1
          echo "libcudartへの動的依存はありません"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: avisynthplus_${{ matrix.dockerimg }}
          path: |
            ${{ steps.build_exec.outputs.pkg_avisynth_deb }}
            ${{ steps.build_exec.outputs.pkg_avisynth_tar_xz }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: avisynthcudafilters_${{ matrix.dockerimg }}
          path: |
            ${{ steps.build_exec.outputs.pkg_avisynthcudafilters_deb }}
            ${{ steps.build_exec.outputs.pkg_avisynthcudafilters_tar_xz }}

      - name: Upload Release Asset
        id: upload-release-asset 
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            ${{ steps.build_exec.outputs.pkg_avisynth_deb }}
            ${{ steps.build_exec.outputs.pkg_avisynth_tar_xz }}
            ${{ steps.build_exec.outputs.pkg_avisynthcudafilters_deb }}
            ${{ steps.build_exec.outputs.pkg_avisynthcudafilters_tar_xz }}
